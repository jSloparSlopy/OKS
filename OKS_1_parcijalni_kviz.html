<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKS – 1. parcijalni: mega kviz</title>
<style>
:root{
  --bg:#eef3f3; --card:#ffffff; --ink:#12303f; --muted:#5b7380; --line:#d3dfe1;
  --teal:#2f7f86; --teal-soft:#dcecec; --navy:#0b3d6b; --ok:#23744a; --ok-soft:#dff2e6;
  --bad:#b03a2a; --bad-soft:#f8e1dc; --warn:#8a6100;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1c22; --card:#16272f; --ink:#e4eef0; --muted:#93aab3; --line:#2a414b;
    --teal:#5db8bf; --teal-soft:#1d3a40; --navy:#8cc0ee; --ok:#6fd09b; --ok-soft:#173a29;
    --bad:#f08a78; --bad-soft:#40201b; --warn:#e5b94d; color-scheme: dark; }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-weight:700;font-size:15px;color:var(--navy);letter-spacing:.2px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:13px}
#timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;padding:4px 12px;border-radius:8px;background:var(--teal-soft);color:var(--ink)}
#timer.low{background:var(--bad-soft);color:var(--bad)}
h1{font-size:34px;line-height:1.15;margin:8px 0 8px;color:var(--navy)}
h2{font-size:22px;margin:0 0 10px}
p.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.cats label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cats label:last-child{border-bottom:0}
.cats input{width:20px;height:20px;accent-color:var(--teal)}
.cats .n{margin-left:auto;color:var(--muted);font-size:14px}
.modes{display:grid;gap:12px}
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--teal);
  border-radius:10px;padding:16px 18px;color:var(--ink);font:inherit;cursor:pointer}
.mode:hover{border-color:var(--teal)}
.mode b{display:block;font-size:19px;margin-bottom:2px}
.mode span{color:var(--muted);font-size:15px}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode.exam{border-left-color:var(--navy)}
.mode.wrong{border-left-color:var(--bad)}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .2s}
.qtext{font-size:22px;line-height:1.35;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:2px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--teal)}
.opt .k{flex:none;width:28px;height:28px;border-radius:6px;background:var(--teal-soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt.sel{border-color:var(--navy);background:var(--teal-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:6px solid var(--ok);background:var(--ok-soft)}
.fb.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:9px;border:2px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#0f1c22}}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.mode:focus-visible,.nv:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.nv{width:36px;height:36px;border-radius:7px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.nv.done{background:var(--teal-soft);border-color:var(--teal)}
.nv.cur{border-color:var(--navy);border-width:3px}
.score{font-size:64px;font-weight:800;line-height:1;margin:6px 0}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.rev{border-top:1px solid var(--line);padding:16px 0}
.rev:first-child{border-top:0}
.rev .q{font-weight:600;margin-bottom:6px}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:5px;margin-right:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.small{font-size:15px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin-top:14px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:13px}
@media (max-width:520px){h1{font-size:28px}.qtext{font-size:19px}.score{font-size:52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

["L","Što je rootkit?","Malware koji povećava privilegije neovlaštenog korisnika i mijenja kernel ili njegove module","Alat za sigurnosnu kopiju","Vrsta vatrozida","Malware koji samo šalje spam","Rootkit mijenja najosnovnije operacije OS-a."],

["L","Što radi naredba ls -l | grep host?","Filtrira izlaz ls -l i prikazuje samo retke koji sadrže 'host'","Briše datoteke koje sadrže 'host'","Instalira paket host","Mijenja dozvole","Piping ls i grep."],

/* ======================= N: NAPADI I LABOSI ======================= */
["N","Što je phishing?","Lažna poruka/stranica koja se pretvara da je pouzdan izvor kako bi ukrala podatke ili navela korisnika na radnju","Fizička krađa računala","Prekid mrežnog kabela","Kopiranje diska","Primjer na predavanju: lažna 'Službena NIAS obavijest' s rokom za verifikaciju."],

["N","Što je DoS napad (uskraćivanje usluge)?","Napad kojim se usluga čini nedostupnom legitimnim korisnicima","Krađa lozinki","Instalacija rootkita","Skeniranje portova","DoS cilja dostupnost (A u CIA)."],
["N","Koju sastavnicu CIA trijade prvenstveno ugrožava DoS napad?","Dostupnost","Povjerljivost","Cjelovitost","Autentičnost","Ispad usluge/DoS = dostupnost."],

["N","Što je socijalni inženjering?","Manipulacija ljudima kako bi odali podatke ili obavili radnju","Programiranje društvenih mreža","Šifriranje komunikacije","Konfiguriranje rutera","Phishing je oblik socijalnog inženjeringa."],
["N","Što je 'zero-day' ranjivost?","Ranjivost koju proizvođač još ne zna ili za koju još ne postoji patch","Ranjivost koja traje jedan dan","Ranjivost popravljena prije izlaska softvera","Ranjivost samo u Linuxu","Patchevi proizvođača popravljaju poznate ranjivosti."],
["N","Koja je najbolja obrana od napada koji iskorištavaju poznate ranjivosti (npr. EternalBlue)?","Redovito instaliranje sigurnosnih patcheva i ažuriranja","Isključivanje firewalla","Dijeljenje administratorske lozinke","Onemogućavanje antivirusa","Treba koristiti sustave koji automatski distribuiraju, instaliraju i prate sigurnosna ažuriranja."],
["N","Koji alat u Windowsima koristi analitičar da provjeri postoji li neovlaštena veza prema vanjskoj IP adresi?","netstat -abno","net accounts","net share","ipconfig","Povezivanje veze s procesom po PID-u."],
["N","Koji Linux zapis prvo provjeriti za sumnjive pokušaje prijave (Debian/Ubuntu)?","/var/log/auth.log","/var/log/dmesg","/var/log/cron","/var/log/boot.log","Bilježi autentikaciju; na RedHat/CentOS /var/log/secure."],
["N","Što je OS hardening u kontekstu obrane od napada?","Smanjenje površine napada gašenjem nepotrebnih usluga, ažuriranjem i jakom autentikacijom","Povećanje brzine procesora","Vizualno prilagođavanje sučelja","Uklanjanje svih korisnika","Attack surface = skup točaka kroz koje napadač može napasti."],
["N","Što je 'attack surface' (napadačka površina)?","Skup svih točaka kroz koje napadač može pokušati ući u sustav","Fizički prostor SOC-a","Vrsta malwarea","Tip vatrozida","Ključni pojmovi: threat actor, target, vulnerabilities, attack surface, attack, threat, impact."]
];

/* ------------------------------------------------------------------ */
const CATS = {S:"Uvod i SOC (M1–2)", W:"Windows (M3)", L:"Linux (M4)", N:"Napadi i labosi"};
const Q = RAW.map((r,i)=>{
  if(r.length!==7) console.warn("Neispravan redak", i, r[1]);
  return {id:i, c:r[0], q:r[1], opts:[r[2],r[3],r[4],r[5]], e:r[6]};
});
const EXAM_N = 15, EXAM_SEC = 600, MAX_PTS = 20, PASS_PTS = 10;
const L = "ABCD";

/* ---------- pomoćne funkcije ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function getWrong(){ try{ return new Set(JSON.parse(localStorage.getItem("oks1_wrong")||"[]")); }catch(e){ return mem.wrong; } }
function setWrong(s){ mem.wrong=s; try{ localStorage.setItem("oks1_wrong", JSON.stringify([...s])); }catch(e){} }
const mem = {wrong:new Set()};
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

let sel = new Set(Object.keys(CATS));
let S = null, timerId = null;

/* ---------- ekrani ---------- */
function home(){
  stopTimer(); S = null; $("#timer").hidden = true;
  const wrong = getWrong(), wrongCount = Q.filter(q=>wrong.has(q.id)).length;
  const counts = {}; Q.forEach(q=>counts[q.c]=(counts[q.c]||0)+1);
  $("#app").innerHTML = `
    <h1>Mega kviz za 1. parcijalni</h1>
    <p class="lead">${Q.length} pitanja iz modula 1–4 (predavanja 1 i 2) i s tema laboratorijskih vježbi. Pravi ispit: 15 pitanja, 10 minuta, 20 bodova, prolaz od 10 bodova.</p>
    <div class="panel cats">
      <h2>Što želiš vježbati?</h2>
      ${Object.keys(CATS).map(k=>`<label><input type="checkbox" data-cat="${k}" ${sel.has(k)?"checked":""}> ${esc(CATS[k])}<span class="n">${counts[k]||0} pitanja</span></label>`).join("")}
    </div>
    <div class="modes">
      <button class="mode exam" data-mode="exam"><b>Simulacija ispita</b><span>${EXAM_N} nasumičnih pitanja, mjerač od 10 minuta, rezultat tek na kraju.</span></button>
      <button class="mode" data-mode="practice"><b>Vježba</b><span>Sva odabrana pitanja redom, odmah vidiš točan odgovor i objašnjenje.</span></button>
      <button class="mode wrong" data-mode="wrong" ${wrongCount?"":"disabled"}><b>Moje pogreške</b><span>${wrongCount?`Ponovi ${wrongCount} pitanja koja si ranije pogriješio/la.`:"Još nema pogrešnih odgovora. Pojavit će se nakon prvog kviza."}</span></button>
    </div>
    <p class="hint">Tipke: <kbd>1</kbd>–<kbd>4</kbd> ili <kbd>A</kbd>–<kbd>D</kbd> biraju odgovor, <kbd>Enter</kbd> ili <kbd>→</kbd> ide dalje.</p>`;
}

function start(mode){
  const wrong = getWrong();
  let pool = Q.filter(q=>sel.has(q.c));
  if(mode==="wrong") pool = Q.filter(q=>wrong.has(q.id));
  if(!pool.length){ alert("Odaberi barem jednu temu."); return; }
  if(mode==="exam") pool = shuffle(pool).slice(0, EXAM_N);
  else pool = shuffle(pool);
  S = { mode, i:0, done:false, left:EXAM_SEC,
        list: pool.map(q=>({q, order:shuffle([0,1,2,3]), ans:null})) };
  if(mode==="exam"){ $("#timer").hidden=false; tick(); timerId=setInterval(tick,1000); }
  else $("#timer").hidden = true;
  render();
}

function tick(){
  const t=$("#timer"); t.textContent=fmt(S.left); t.classList.toggle("low", S.left<=60);
  if(S.left<=0){ finish(true); return; }
  S.left--;
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function render(){ if(!S) home(); else if(S.done) results(); else question(); }

function question(){
  const it = S.list[S.i], n = S.list.length, exam = S.mode==="exam";
  const locked = !exam && it.ans!==null;
  const correctPos = it.order.indexOf(0);
  const opts = it.order.map((orig,pos)=>{
    let cls="opt", dis="";
    if(exam){ if(it.ans===pos) cls+=" sel"; }
    else if(locked){ dis="disabled"; if(pos===correctPos) cls+=" ok"; else if(pos===it.ans) cls+=" bad"; }
    return `<button class="${cls}" data-pick="${pos}" ${dis}><span class="k">${L[pos]}</span><span>${esc(it.q.opts[orig])}</span></button>`;
  }).join("");
  let fb="";
  if(locked){
    const ok = it.ans===correctPos;
    fb = `<div class="fb ${ok?"":"bad"}" role="status"><b>${ok?"Točno.":"Netočno."}</b>${ok?"":`Točan odgovor: ${L[correctPos]}. `}${esc(it.q.e)}</div>`;
  }
  const answered = S.list.filter(x=>x.ans!==null).length;
  const nav = exam ? `<div class="nav">${S.list.map((x,k)=>`<button class="nv ${x.ans!==null?"done":""} ${k===S.i?"cur":""}" data-go="${k}" aria-label="Pitanje ${k+1}">${k+1}</button>`).join("")}</div>` : "";
  const last = S.i===n-1;
  $("#app").innerHTML = `
    <div class="qmeta"><span>Pitanje ${S.i+1} od ${n}</span><span>${esc(CATS[it.q.c])}${exam?` · odgovoreno ${answered}/${n}`:""}</span></div>
    <div class="bar"><i style="width:${(S.i+(locked?1:0))/n*100}%"></i></div>
    <div class="panel">
      <p class="qtext">${esc(it.q.q)}</p>
      <div class="opts">${opts}</div>
      ${fb}
    </div>
    <div class="row">
      ${S.i>0?`<button class="btn ghost" data-act="prev">Natrag</button>`:""}
      ${exam
        ? (last?`<button class="btn" data-act="finish">Završi ispit</button>`:`<button class="btn" data-act="next">Dalje</button>`)
        : `<button class="btn" data-act="next" ${locked?"":"disabled"}>${last?"Prikaži rezultat":"Dalje"}</button>`}
      ${exam&&!last?`<button class="btn ghost" data-act="finish">Završi ispit</button>`:""}
      <button class="btn ghost" data-act="quit">Izlaz</button>
    </div>${nav}`;
}

function pick(pos){
  const it = S.list[S.i];
  if(S.mode==="exam"){ it.ans = pos; question(); return; }
  if(it.ans!==null) return;
  it.ans = pos;
  const ok = pos===it.order.indexOf(0), w=getWrong();
  if(ok) w.delete(it.q.id); else w.add(it.q.id);
  setWrong(w); question();
}

function next(){
  if(S.i<S.list.length-1){ S.i++; question(); }
  else finish(false);
}

function finish(timeUp){
  if(S.mode==="exam" && !timeUp){
    const un = S.list.filter(x=>x.ans===null).length;
    if(un && !confirm(`Imaš ${un} neodgovorenih pitanja. Završiti ispit?`)) return;
  }
  stopTimer(); $("#timer").hidden = true;
  if(S.mode==="exam"){
    const w=getWrong();
    S.list.forEach(x=>{ if(x.ans!==null){ if(x.ans===x.order.indexOf(0)) w.delete(x.q.id); else w.add(x.q.id);} else w.add(x.q.id); });
    setWrong(w);
  }
  S.done = true; S.timeUp = timeUp; S.onlyWrong = false; render();
}

function results(){
  const n=S.list.length, correct=S.list.filter(x=>x.ans===x.order.indexOf(0)).length;
  const pct = Math.round(correct/n*100);
  let head;
  if(S.mode==="exam"){
    const pts = Math.round(correct/n*MAX_PTS*10)/10, pass = pts>=PASS_PTS;
    head = `<p class="small">${S.timeUp?"Vrijeme je isteklo. ":""}Točno ${correct} od ${n}</p>
      <div class="score ${pass?"pass":"fail"}">${pts.toString().replace(".",",")} / ${MAX_PTS}</div>
      <p><b class="${pass?"pass":"fail"}">${pass?"Prolaz":"Nedovoljno"}</b> – prag je ${PASS_PTS} bodova, a to je otprilike ${Math.ceil(PASS_PTS/MAX_PTS*n)} točnih odgovora od ${n}.</p>`;
  } else {
    head = `<p class="small">Točno ${correct} od ${n}</p><div class="score ${pct>=50?"pass":"fail"}">${pct}%</div>`;
  }
  const items = S.list.map((x,k)=>({x,k,ok:x.ans===x.order.indexOf(0)})).filter(o=>!S.onlyWrong||!o.ok);
  const list = items.map(({x,k,ok})=>{
    const cp = x.order.indexOf(0);
    const mine = x.ans===null ? "bez odgovora" : esc(x.q.opts[x.order[x.ans]]);
    return `<div class="rev"><div class="q"><span class="tag ${ok?"ok":"bad"}">${ok?"točno":"netočno"}</span>${k+1}. ${esc(x.q.q)}</div>
      ${ok?"":`<div class="small">Tvoj odgovor: ${mine}</div>`}
      <div class="small">Točan odgovor: <b style="color:var(--ink)">${esc(x.q.opts[0])}</b></div>
      <div class="small">${esc(x.q.e)}</div></div>`;
  }).join("") || `<p class="small">Nema pogrešnih odgovora. Odlično.</p>`;
  $("#app").innerHTML = `
    <div class="panel">${head}
      <div class="row"><button class="btn" data-act="home">Natrag na početak</button>
      <button class="btn ghost" data-act="again">Ponovi ovaj način</button>
      <button class="btn ghost" data-act="toggle">${S.onlyWrong?"Prikaži sve":"Samo pogrešni"}</button></div></div>
    <div class="panel"><h2>Pregled odgovora</h2>${list}</div>`;
}

/* ---------- događaji ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,input"); if(!t) return;
  if(t.dataset.cat){ t.checked ? sel.add(t.dataset.cat) : sel.delete(t.dataset.cat); return; }
  if(t.dataset.mode){ start(t.dataset.mode); return; }
  if(t.dataset.pick!==undefined){ pick(+t.dataset.pick); return; }
  if(t.dataset.go!==undefined){ S.i=+t.dataset.go; question(); return; }
  switch(t.dataset.act){
    case "next": next(); break;
    case "prev": S.i--; question(); break;
    case "finish": finish(false); break;
    case "quit": if(confirm("Prekinuti kviz?")) home(); break;
    case "home": home(); break;
    case "again": start(S.mode); break;
    case "toggle": S.onlyWrong=!S.onlyWrong; results(); break;
  }
});
document.addEventListener("keydown", e=>{
  if(!S || S.done || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase(), idx = "1234".indexOf(k)>=0 ? "1234".indexOf(k) : "ABCD".indexOf(k);
  if(k.length===1 && idx>=0){ pick(idx); return; }
  if(e.key==="ArrowRight"||e.key==="Enter"){
    if(document.activeElement && document.activeElement.classList.contains("opt") && e.key==="Enter") return;
    const it=S.list[S.i]; if(S.mode==="exam" || it.ans!==null){ e.preventDefault(); if(S.mode==="exam"&&S.i===S.list.length-1) return; next(); }
  }
  if(e.key==="ArrowLeft" && S.i>0){ S.i--; question(); }
});

home();
</script>
